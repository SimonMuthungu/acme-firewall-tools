name: Python CI and Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Ruff for code style
      run: ruff check .

    - name: Run Pytest
      run: pytest -v

    - name: Build Docker image
      run: docker build -t acme-audit-tool .